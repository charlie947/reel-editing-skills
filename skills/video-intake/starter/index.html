<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video starter</title>
<style>
  :root {
    --bg: #ffffff;        /* swap for your brand */
    --ink: #1d1d1f;
    --accent: #0071e3;
    --font: "SF Pro Display", "Inter", system-ui, sans-serif;
    --W: 1080px; --H: 1920px;   /* 9:16 by default. ?f=linkedin | square | wide switch the size below */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--ink); }
  #video { position: relative; width: var(--W); height: var(--H); overflow: hidden; background: var(--bg); }

  /* face layer: one JPG per frame, cut from your recording */
  #face { position: absolute; object-fit: cover; transition: none; }
  #face.full  { left: 0; top: 0; width: 1080px; height: 1920px; border-radius: 0; }
  #face.split { object-position: 50% 35%; left: 40px; top: 1000px; width: 1000px; height: 860px; border-radius: 44px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.35); }
  #face.off   { display: none; }

  /* graphic stage: your beats draw in here */
  #stage { position: absolute; left: 0; top: 0; width: 1080px; overflow: hidden; }
  #stage.split { height: 1000px; }
  #stage.full  { height: 1920px; }
  #stage.off   { display: none; }

  /* captions: one fixed line, same height on every beat */
  /* a white pill in the middle of the frame, never on your chin, never at the bottom */
  #cap { position: absolute; left: 0; right: 0; top: 962px; text-align: center; pointer-events: none; z-index: 20; }
  #cap .pill { display: inline-block; background: #fff; color: var(--ink); border-radius: 999px; padding: 14px 30px; font-size: 52px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.1; box-shadow: 0 10px 30px -12px rgba(0,0,0,.35); }
  #cap .pill:empty { display: none; }
  #cap span { display: inline-block; margin: 0 .1em; }

  /* text hook: frame 0, two lines, over the face */
  #hook { position: absolute; left: 60px; right: 60px; top: 260px; text-align: center; z-index: 30; }
  /* every size keeps the same idea: motion panel, one caption line at the seam, face card */
  /* 4:5 (1080 x 1350) for LinkedIn and feeds: motion on top, face card below */
  html.li { --H: 1350px; }
  html.li #face.full  { height: 1350px; }
  html.li #face.split { left: 60px; top: 700px; width: 960px; height: 610px; border-radius: 40px; }
  html.li #stage.split { height: 620px; }
  html.li #stage.full  { height: 1350px; }
  html.li #cap  { top: 618px; }
  html.li #hook { top: 150px; }

  /* 1:1 (1080 x 1080) for ads and X */
  html.square { --H: 1080px; }
  html.square #face.full  { height: 1080px; }
  html.square #face.split { left: 60px; top: 560px; width: 960px; height: 480px; border-radius: 36px; }
  html.square #stage.split { height: 500px; }
  html.square #stage.full  { height: 1080px; }
  html.square #cap  { top: 486px; }
  html.square #cap .pill { font-size: 44px; }
  html.square #hook { top: 110px; }
  html.square #hook .box { font-size: 60px; }

  /* 16:9 (1920 x 1080) for YouTube, your website and sales emails: motion left, face card right */
  html.wide { --W: 1920px; --H: 1080px; }
  html.wide #face.full  { width: 1920px; height: 1080px; }
  html.wide #face.split { left: 1240px; top: 140px; width: 620px; height: 800px; border-radius: 40px; }
  html.wide #stage { width: 1200px; }
  html.wide #stage.split { height: 1080px; }
  html.wide #stage.full  { width: 1920px; height: 1080px; }
  html.wide #cap  { top: 950px; }
  html.wide[data-layout="split"] #cap { right: 720px; }   /* under the motion panel, not the face card */
  html.wide #hook { top: 120px; }

  #hook .box { display: inline-block; background: #fff; color: #000; border-radius: 22px; padding: 26px 34px; font-size: 72px; font-weight: 750; line-height: 1.1; max-width: 92%; text-wrap: balance; letter-spacing: -0.02em; box-shadow: 0 20px 50px -20px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="video">
  <img id="face" alt="">
  <div id="stage"></div>
  <div id="hook"><div class="box"></div></div>
  <div id="cap"></div>
</div>
<audio id="audio" src="cut-audio.wav" preload="auto"></audio>
<script>
// which size: 9:16 by default, or ?f=linkedin (4:5), ?f=square (1:1), ?f=wide (16:9). ?li still works
const Q = new URLSearchParams(location.search);
const FORMAT = Q.get('f') || (Q.has('li') ? 'linkedin' : 'vertical');
document.documentElement.classList.add(FORMAT === 'linkedin' ? 'li' : FORMAT);
// size every object from PANEL, so one beat renders every size
// PANEL.w = motion panel width, PANEL.split = its height on a split beat, PANEL.full = height on a full beat
window.PANEL = {
  vertical: { w: 1080, split: 1000, full: 1920 },
  linkedin: { w: 1080, split: 620,  full: 1350 },
  square:   { w: 1080, split: 500,  full: 1080 },
  wide:     { w: 1200, split: 1080, full: 1080 },
}[FORMAT];
</script>
<script src="words.js"></script>
<script src="video.js"></script>
<script>
// ---------- helpers every beat can use ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));              // 0..1 between a and b
const easeOut = p => 1 - Math.pow(1 - p, 3);                      // snaps in, settles
const spring = p => 1 - Math.exp(-6 * p) * Math.cos(9 * p * (1 - p)); // settle, tiny overshoot
// start time of a spoken word. A word said more than once: pass the time to search after, e.g. wordAt('every', 5)
const wordAt = (w, after = 0) => (WORDS.find(x => x.s >= after && x.w.toLowerCase().replace(/[^a-z0-9]/g, '') === w.toLowerCase()) || {}).s;

// ---------- the engine: everything is worked out from t alone ----------
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(6, '0');

function captionAt(t) {
  // groups of up to 4 words, a new group starts after a pause or every 4 words
  const groups = []; let g = [];
  WORDS.forEach((w, i) => {
    const gap = i ? w.s - WORDS[i - 1].e : 0;
    if (g.length && (g.length >= VIDEO.capWords || gap > 0.35)) { groups.push(g); g = []; }
    g.push(w);
  });
  if (g.length) groups.push(g);
  // a group stays up 0.35s after its last word, but never past the next group's first word
  const cur = groups.find((gr, i) => {
    const next = groups[i + 1];
    const end = Math.min(gr[gr.length - 1].e + 0.35, next ? next[0].s - 0.05 : Infinity);
    return t >= gr[0].s - 0.05 && t < end;
  });
  return cur || [];
}

function seek(t) {
  const beat = VIDEO.beats.find(b => t >= b.start && t < b.end) || VIDEO.beats[VIDEO.beats.length - 1];
  const layout = beat.layout;                                    // 'face' | 'split' | 'full'
  const face = $('face'), stage = $('stage');

  // face frame
  const f = Math.min(VIDEO.faceFrames, Math.max(1, Math.round(t * VIDEO.fps) + 1));
  const src = 'face/' + pad(f) + '.jpg';
  if (face.getAttribute('src') !== src) face.setAttribute('src', src);
  face.className = layout === 'face' ? 'full' : layout === 'split' ? 'split' : 'off';
  document.documentElement.dataset.layout = layout;

  // stage: the beat draws itself from its own local time
  stage.className = layout === 'face' ? 'off' : layout;
  if (stage.dataset.beat !== String(VIDEO.beats.indexOf(beat))) {
    stage.innerHTML = beat.html || '';
    stage.dataset.beat = VIDEO.beats.indexOf(beat);
  }
  if (beat.draw) beat.draw(t - beat.start, stage, t);

  // text hook from frame 0
  const hook = $('hook');
  const on = t < VIDEO.hookEnd;
  hook.style.display = on ? 'block' : 'none';
  if (on) hook.querySelector('.box').innerHTML = VIDEO.hook.join('<br>');

  // captions: each word fades in from blur as it is spoken
  const cap = $('cap');
  const words = on ? [] : captionAt(t);
  cap.innerHTML = '<div class="pill">' + words.map(w => {
    const p = easeOut(prog(t, w.s, w.s + 0.22));
    return `<span style="opacity:${p};filter:blur(${(1 - p) * 7}px)">${w.w}</span>`;
  }).join('') + '</div>';
  return Promise.all([...document.images].filter(i => i.getAttribute('src')).map(i => i.decode().catch(() => {})));
}
window.seek = seek;

// open normally = play with sound. ?render = wait for seek(t).
if (!location.search.includes('render')) {
  const a = $('audio'); let t0 = performance.now();
  document.body.addEventListener('click', () => { a.currentTime = 0; a.play(); t0 = performance.now(); });
  (function loop() { const t = ((performance.now() - t0) / 1000) % VIDEO.duration; seek(a.paused ? t : a.currentTime); requestAnimationFrame(loop); })();
} else { seek(Number(new URLSearchParams(location.search).get('t')) || 0); }  // ?render&t=3.2 opens one frame, add &f=wide for another size
</script>
</body>
</html>
